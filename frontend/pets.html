<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pets | Loja Pet</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">🐾 Loja Pet</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active fw-bold" href="pets.html">
              <i class="bi bi-heart-fill me-1"></i>Pets
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="produtos.html">
              <i class="bi bi-bag-fill me-1"></i>Produtos
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Conteúdo -->
  <div class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">🐾 Pets</h2>
      <button class="btn btn-primary" onclick="abrirModalNovo()">
        <i class="bi bi-plus-circle me-2"></i>Novo Pet
      </button>
    </div>

    <!-- Tabela -->
    <div class="table-responsive">
      <table class="table table-hover table-bordered align-middle">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Espécie</th>
            <th>Peso (kg)</th>
            <th>Idade</th>
            <th>Nascimento</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaPets">
          <tr>
            <td colspan="7" class="text-center py-4">
              <div class="spinner-border text-primary" role="status"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- Modal Criar/Editar -->
  <div class="modal fade" id="modalForm" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitulo">Novo Pet</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="petId" />
          <div class="mb-3">
            <label class="form-label fw-semibold">Nome</label>
            <input type="text" id="petNome" class="form-control" placeholder="Ex: Rex" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Espécie</label>
            <select id="petEspecie" class="form-select" required>
              <option value="" disabled selected>Selecione uma espécie...</option>
              <option value="Cachorro">🐶 Cachorro</option>
              <option value="Gato">🐱 Gato</option>
              <option value="Ave">🐦 Ave</option>
              <option value="Peixe">🐟 Peixe</option>
              <option value="Animal Silvestre">🦎 Animal Silvestre</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Peso (kg)</label>
            <input type="number" id="petPeso" class="form-control" step="0.01" min="0" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Idade (anos)</label>
            <input type="number" id="petIdade" class="form-control" min="0" required />
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Data de Nascimento</label>
            <input type="date" id="petNascimento" class="form-control" max="" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnSalvar" onclick="salvarPet()">
            Salvar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="js/api.js"></script>
  <script src="js/pets.js"></script>

</body>
</html>
